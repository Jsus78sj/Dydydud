name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor and create Android project
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abood.gymmate",
            "appName": "GymMate",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android

      - name: Patch manifest, icons and version
        run: |
          python3 -m pip install --user --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image

          # manifest: camera + portrait
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = ('    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n')
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', perm + '    <application', 1)
          s = s.replace('<activity', '<activity android:screenOrientation="portrait"', 1)
          open(p, 'w', encoding='utf-8').write(s)

          # icons
          res = 'android/app/src/main/res'
          fg = Image.open('public/icons/maskable-512.png').convert('RGBA')
          ic = Image.open('public/icons/icon-512.png').convert('RGBA')
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, fgsize) in dens.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              small = ic.resize((legacy, legacy), Image.LANCZOS)
              small.save(f'{folder}/ic_launcher.png')
              small.save(f'{folder}/ic_launcher_round.png')
              fg.resize((fgsize, fgsize), Image.LANCZOS).save(f'{folder}/gm_fg.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs(f'{res}/values', exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@color/gm_bg"/>\n'
                 '  <foreground android:drawable="@mipmap/gm_fg"/>\n'
                 '</adaptive-icon>\n')
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w', encoding='utf-8').write(xml)
          open(f'{res}/values/gm_colors.xml', 'w', encoding='utf-8').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="gm_bg">#0E0D0B</color>\n</resources>\n')
          PY
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Android SDK
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

