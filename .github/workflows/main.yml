            --ks-pass pass:gymmate2026 --key-pass pass:gymmate2026 \
            --out GymMate.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify GymMate.apk
          ls -lh GymMate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GymMate-apk
          path: GymMate.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" GymMate.apk \
            --title "GymMate APK #${{ github.run_number }}" \
            --notes "Standalone Android APK (Capacitor). Download GymMate.apk and install."
